name: Bug Report
description: Report a reproducible problem or crash in Flow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: app_version
    attributes:
      label: App Version
      description: The version of Flow you are running (e.g. v1.0.6)
      placeholder: e.g. v1.0.6 (6)
    validations:
      required: true
  - type: input
    id: device_info
    attributes:
      label: Device & Android Version
      description: Your phone model and Android version
      placeholder: e.g. Google Pixel 7, Android 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we trigger the issue?
      value: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Logs / Screenshots
      description: Attach relevant logcat output or screenshots if applicable.
